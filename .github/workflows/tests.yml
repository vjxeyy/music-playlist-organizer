name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest versions the README promises.
        python: ["3.8", "3.14"]
        mysql: ["8.0", "26.7"]

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Use the example database login (root / root, matching the MySQL service)
        run: cp db_config.example.py db_config.py

      - name: Wait for MySQL to start
        run: |
          python - <<'EOF'
          import time
          import mysql.connector

          for attempt in range(60):
              try:
                  mysql.connector.connect(host="127.0.0.1", user="root", password="root").close()
                  print("MySQL is ready")
                  break
              except mysql.connector.Error as err:
                  print("waiting for MySQL:", err)
                  time.sleep(2)
          else:
              raise SystemExit("MySQL did not start in time")
          EOF

      - name: Run tests
        run: python -m pytest -v
        env:
          REQUIRE_MYSQL: "1"
          MUSIC_DB_HOST: 127.0.0.1
