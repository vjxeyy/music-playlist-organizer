<text x="530" y="184" class="lb c">Many-to-many link</text>
<text x="530" y="204" class="s c">A song can be in many playlists,</text>
<text x="530" y="224" class="s c">and a playlist holds many songs.</text>
<text x="530" y="244" class="s c">Both links use ON DELETE CASCADE,</text>
<text x="530" y="264" class="s c">so deleting a song also removes</text>
<text x="530" y="284" class="s c">it from every playlist.</text>
